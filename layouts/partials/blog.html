<section class="resume-section p-3 p-lg-5 d-flex align-items-center" id="blog">
  <div class="w-100">
    <h2 class="mb-5">Blog Posts</h2>

    {{ range where .Site.Pages "Section" "blog" }}
    <div class="blog-item mb-4">
      <h4 class="blog-title">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
      </h4>
      <div class="blog-meta mb-2">
        <small class="text-muted">{{ .Date.Format "Jan 2, 2006" }}</small>
      </div>
      <p class="blog-summary">{{ .Summary | truncate 150 }}</p>
      <div class="blog-actions">
        <a href="{{ .Permalink }}" class="btn btn-outline-primary btn-sm">
          <i class="fas fa-book-open"></i> Read More
        </a>
        {{ if .Params.tags }}
        <div class="blog-tags mt-2">
          {{ range .Params.tags }}
          <span class="badge badge-light mr-1">{{ . }}</span>
          {{ end }}
        </div>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</section>
